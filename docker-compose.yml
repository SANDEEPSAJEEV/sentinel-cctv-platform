services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sentinel-postgis
    environment:
      POSTGRES_USER: sentinel
      # Local sandbox credential. In deployment this comes from the environment
      # or a secret store — never from a file in the repo.
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel_local_dev}
      POSTGRES_DB: sentinel
    ports:
      # 55432, not 5432: a local Postgres already owns 5432 on the dev machine.
      - "127.0.0.1:55432:5432"     # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./registry/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"     # localhost only
    volumes:
      - redisdata:/data
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: sentinel-mediamtx
    ports:
      - "8554:8554"   # RTSP        — same port as the Sentinel grid
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC / WHEP
      - "9997:9997"   # MediaMTX control API (local only; do NOT call the real one)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  publisher:
    image: linuxserver/ffmpeg:latest
    container_name: sentinel-publisher
    depends_on:
      - mediamtx
    entrypoint: ["/bin/sh", "/publish.sh"]
    volumes:
      - ./publish.sh:/publish.sh:ro
      - ./media:/media:ro
    environment:
      - RTSP_HOST=mediamtx
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
